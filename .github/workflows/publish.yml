# Publish the package from CI through npm Trusted Publishing (OIDC).
#
# No npm token and no one-time password: npm trusts this workflow because
# GitHub signs a short-lived OIDC token naming this repository and file.
# One-time setup on npmjs.com (package page -> Settings -> Trusted Publisher):
#   publisher:         GitHub Actions
#   organization/user: raven3005672
#   repository:        dsh-plugin-im-remote-control
#   workflow filename: publish.yml
#   allowed actions:   npm publish
#
# Release: bump the version, commit, then push a matching tag:
#   git tag v0.1.0 && git push origin v0.1.0

name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for the OIDC exchange with npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: trusted publishing authenticates through OIDC, and a
      # registry auth token would override that path.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.2+; the bundled one may be older.
      - run: npm install --global npm@latest

      - run: npm ci

      - name: Check the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      # Explicit evidence in the run log; `npm publish` re-runs the same checks
      # through prepublishOnly and builds through prepack.
      - run: npm run verify

      - run: npm publish --provenance
